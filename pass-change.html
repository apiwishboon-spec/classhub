<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset | MyClassHub</title>
    <link rel="stylesheet" href="style.css?v=34">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            margin: 0;
            padding: 1rem;
        }
        .pass-change-container {
            max-width: 400px;
            width: 100%;
            padding: 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            animation: modalSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-section img {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
        }
        .logo-section h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 0.9rem;
            display: none;
        }
        .message.error {
            display: block;
            background-color: rgba(218, 30, 40, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
        }
        .message.success {
            display: block;
            background-color: rgba(36, 161, 72, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }
        #loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            z-index: 10;
        }
        [data-theme="dark"] #loading-overlay {
            background: rgba(38, 38, 38, 0.8);
        }
    </style>
</head>
<body>
    <div class="pass-change-container" id="main-card">
        <div id="loading-overlay">
            <div class="loader"></div>
        </div>
        
        <div class="logo-section">
            <img src="logo.png" alt="MyClassHub Logo">
            <h1>Reset Password</h1>
        </div>

        <div id="reset-form-ui" style="display: none;">
            <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.5rem;">
                Enter a new password for <strong id="user-email">...</strong>
            </p>
            
            <div class="form-group">
                <label class="form-label">New Password</label>
                <div style="position: relative;">
                    <input type="password" id="new-password" placeholder="At least 6 characters" class="form-input">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Repeat new password" class="form-input">
            </div>

            <button id="submit-btn" class="btn-primary btn-full">
                <i class="ph ph-check"></i> Change Password
            </button>
        </div>

        <div id="status-message" class="message"></div>

        <div id="expired-ui" style="display: none; text-align: center;">
            <i class="ph ph-warning-circle" style="font-size: 3rem; color: var(--warning); margin-bottom: 1rem;"></i>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">This link is invalid or has expired.</p>
            <a href="/admin" class="btn-secondary btn-full" style="text-decoration: none; display: block;">Return to Login</a>
        </div>

        <div id="success-ui" style="display: none; text-align: center;">
            <i class="ph ph-check-circle" style="font-size: 3rem; color: var(--success); margin-bottom: 1rem;"></i>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Your password has been updated successfully!</p>
            <a href="/admin" class="btn-primary btn-full" style="text-decoration: none; display: block;">Login Now</a>
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const loadingOverlay = document.getElementById('loading-overlay');
        const resetFormUi = document.getElementById('reset-form-ui');
        const expiredUi = document.getElementById('expired-ui');
        const successUi = document.getElementById('success-ui');
        const statusMsg = document.getElementById('status-message');
        const userEmailSpan = document.getElementById('user-email');
        const newPassInput = document.getElementById('new-password');
        const confirmPassInput = document.getElementById('confirm-password');
        const submitBtn = document.getElementById('submit-btn');

        // Theme initialization
        (function() {
            const saved = localStorage.getItem('theme');
            const hour = new Date().getHours();
            const isDark = saved === 'dark' || (saved !== 'light' && (hour < 6 || hour > 18));
            if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
        })();

        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const actionCode = urlParams.get('oobCode');

        if (mode === 'resetPassword' && actionCode) {
            verifyCode();
        } else {
            showExpired();
        }

        async function verifyCode() {
            try {
                const email = await verifyPasswordResetCode(auth, actionCode);
                userEmailSpan.textContent = email;
                loadingOverlay.style.display = 'none';
                resetFormUi.style.display = 'block';
            } catch (error) {
                console.error("Verification error:", error);
                showExpired();
            }
        }

        function showExpired() {
            loadingOverlay.style.display = 'none';
            resetFormUi.style.display = 'none';
            expiredUi.style.display = 'block';
        }

        submitBtn.onclick = async () => {
            const newPass = newPassInput.value;
            const confirmPass = confirmPassInput.value;

            if (newPass.length < 6) {
                showStatus("Password must be at least 6 characters.", "error");
                return;
            }
            if (newPass !== confirmPass) {
                showStatus("Passwords do not match.", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loader" style="width: 20px; border-width: 2px; margin: 0 auto;"></div>';

            try {
                await confirmPasswordReset(auth, actionCode, newPass);
                resetFormUi.style.display = 'none';
                statusMsg.style.display = 'none';
                successUi.style.display = 'block';
            } catch (error) {
                console.error("Reset error:", error);
                showStatus(error.message, "error");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="ph ph-check"></i> Change Password';
            }
        };

        function showStatus(msg, type) {
            statusMsg.textContent = msg;
            statusMsg.className = `message ${type}`;
            statusMsg.style.display = 'block';
        }
    </script>
    <script type="module" src="visits.js"></script>
    <script type="module" src="chat.js"></script>
<script type="module" src="game.js?v=1"></script>    <script type="module" src="bug-report.js"></script>
</body>
</html>
