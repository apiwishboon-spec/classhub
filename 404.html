<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - MyClassHub</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="style.css?v=34">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            padding: 2rem;
        }

        .error-container {
            max-width: 480px;
            text-align: center;
            animation: carbonFadeIn 0.5s cubic-bezier(0.2, 0, 0.38, 0.9);
        }

        @keyframes carbonFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-code {
            font-size: 8rem;
            font-weight: 300;
            letter-spacing: -4px;
            line-height: 1;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .error-divider {
            width: 64px;
            height: 2px;
            background: var(--accent-color);
            margin: 0 auto 2rem;
            animation: carbonExpand 0.6s 0.2s both cubic-bezier(0.2, 0, 0.38, 0.9);
        }

        @keyframes carbonExpand {
            from { width: 0; opacity: 0; }
            to { width: 64px; opacity: 1; }
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 0.75rem;
            color: var(--text-main);
        }

        .error-desc {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin: 0 0 2.5rem;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .carbon-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 2rem;
            font-size: 0.875rem;
            font-weight: 600;
            font-family: inherit;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s;
        }

        .carbon-btn-primary {
            background: var(--accent-color);
            color: #fff;
            border: none;
        }
        .carbon-btn-primary:hover {
            background: var(--accent-hover);
        }

        .carbon-btn-secondary {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }
        .carbon-btn-secondary:hover {
            background: var(--highlight-bg);
        }

        .carbon-btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .carbon-btn-ghost:hover {
            background: var(--highlight-bg);
            color: var(--text-main);
            border-color: var(--text-secondary);
        }

        .error-footer {
            margin-top: 4rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        .error-footer a {
            color: var(--accent-color);
            text-decoration: none;
        }
        .error-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .error-code { font-size: 5rem; }
            .error-actions { flex-direction: column; }
            .carbon-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-divider"></div>
        <h1 class="error-title">Page not found</h1>
        <p class="error-desc">
            The requested page could not be located. It may have been moved or is temporarily unavailable.
        </p>
        <div class="error-actions">
            <a href="/" class="carbon-btn carbon-btn-primary">
                <i class="ph ph-arrow-left"></i> Back to Dashboard
            </a>
            <button class="carbon-btn carbon-btn-secondary" onclick="history.back()">
                <i class="ph ph-caret-left"></i> Go Back
            </button>
            <a href="/contact" class="carbon-btn carbon-btn-ghost">
                <i class="ph ph-envelope-simple"></i> Contact Support
            </a>
        </div>
        <div class="error-footer">
            MyClassHub &mdash; Built for students, by students
        </div>
    </div>

    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            var hour = new Date().getHours();
            var isDark = saved === 'dark' || (saved !== 'light' && (hour < 6 || hour > 18));
            if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
</body>
</html>
