<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Chat - MyClassHub</title>
    <link rel="stylesheet" href="style.css?v=10">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background: var(--bg-color); margin: 0; font-family: 'IBM Plex Sans', sans-serif; }
        .chat-page { display: flex; flex-direction: column; height: 100vh; }
        #staff-chat-messages { flex: 1; overflow-y: auto; padding: 2rem; background: var(--card-bg); display: flex; flex-direction: column; gap: 1rem; }
    </style>
</head>
<body>
    <header class="top-nav" style="background: #fff; border-bottom: 1px solid #ddd; padding: 0.5rem 1rem;">
        <div class="nav-brand">
            <a href="admin.html" style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem; color: #000;">
                <i class="ph ph-caret-left" style="font-size: 1.5rem;"></i>
                <span style="font-weight: 600; font-size: 1.1rem;">Back to Admin</span>
            </a>
        </div>
    </header>

    <main class="chat-page">
        <div id="staff-chat-messages">
            <div class="chat-loader"><span></span><span></span><span></span></div>
        </div>
        <div style="padding: 1rem; border-top: 1px solid #ddd; background: #fff; display: flex; gap: 0.75rem;">
            <textarea id="staff-chat-input" placeholder="Type a message..." class="form-input" style="flex:1; border-radius: 20px; resize: none;"></textarea>
            <button id="send-staff-msg-btn" class="chat-send-btn" style="color: var(--accent-color); font-size: 1.8rem; border:none; background:none; cursor:pointer;">
                <i class="ph ph-paper-plane-right-fill"></i>
            </button>
        </div>
    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
