<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote | MyClassHub</title>
    <link rel="stylesheet" href="style.css?v=34">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            margin: 0;
            padding: 1rem;
        }
        .vote-container {
            max-width: 500px;
            width: 100%;
            padding: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            animation: modalSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .poll-option-btn {
            width: 100%;
            text-align: left;
            position: relative;
            z-index: 1;
            background: var(--bg-color);
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .poll-option-btn:hover:not(:disabled) {
            border-color: var(--accent-color);
            background: var(--highlight-bg);
        }
        .poll-option-btn:disabled {
            cursor: default;
        }
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: rgba(15, 98, 254, 0.1);
            z-index: -1;
            transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .status-msg {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .loading-vote {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    <div class="vote-container">
        <div id="vote-ui" class="loading-vote">
            <div class="loader"></div>
            <p>Loading poll...</p>
        </div>
    </div>

    <script>
        // Theme initialization for vote page
        (function() {
            const saved = localStorage.getItem('theme');
            const hour = new Date().getHours();
            const isDark = saved === 'dark' || (saved !== 'light' && (hour < 6 || hour > 18));
            if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
        })();
    </script>
    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        function escapeHtml(str) {
            if (!str) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
            return String(str).replace(/[&<>"']/g, c => map[c]);
        }

        const voteUi = document.getElementById('vote-ui');

        const urlParams = new URLSearchParams(window.location.search);
        const pollId = urlParams.get('pollId');

        if (!pollId) {
            voteUi.innerHTML = '<i class="ph ph-warning-circle" style="font-size:3rem; color:var(--danger);"></i><p>Invalid Poll Link</p><a href="./" class="btn-secondary" style="text-decoration:none;">Go Home</a>';
        } else {
            initPoll();
        }

        function showToast(message, icon, color) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span class="toast-icon"><i class="ph ${icon}"></i></span><span class="toast-text">${message}</span>`;
            toast.style.borderLeftColor = color || 'var(--accent-color)';
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4500);
        }

        function initPoll() {
            onSnapshot(doc(db, "polls", pollId), (docSnap) => {
                if (!docSnap.exists()) {
                    voteUi.innerHTML = '<i class="ph ph-warning-circle" style="font-size:3rem; color:var(--danger);"></i><p>This poll no longer exists.</p>';
                    return;
                }

                const data = docSnap.data();
                const totalVotes = Object.values(data.votes || {}).reduce((a, b) => a + b, 0);
                const hasVoted = localStorage.getItem(`voted_${pollId}`);
                const isOpen = data.isOpen !== false;

                let html = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
                        <h2 style="margin:0;">${escapeHtml(data.question)}</h2>
                        <span class="time-badge">${totalVotes} votes</span>
                    </div>
                    ${!isOpen && !hasVoted ? `<p style="text-align:center; color:var(--danger); font-weight:600; margin-bottom:1rem;">🗳️ This poll is now CLOSED. See results below.</p>` : ''}
                    <div id="options-list">
                `;

                data.options.forEach(opt => {
                    const count = data.votes[opt] || 0;
                    const percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                    const revealStats = !isOpen || (isOpen && hasVoted);
                    
                    html += `
                        <button class="poll-option-btn" data-option="${escapeHtml(opt)}" ${hasVoted || !isOpen ? 'disabled' : ''}>
                            <span>${escapeHtml(opt)}</span>
                            ${revealStats ? `<span>${percent}% (${count})</span>` : ''}
                            <div class="progress-bar" style="width: ${revealStats ? percent : 0}%"></div>
                        </button>
                    `;
                });

                html += `
                    </div>
                    <div class="status-msg">
                        ${!isOpen ? 'Poll closed by Admin.' : hasVoted ? `You have already voted. Total: ${totalVotes}` : 'Tap an option to vote!'}
                    </div>
                `;

                voteUi.className = '';
                voteUi.innerHTML = html;

                // Add listeners if not voted
                if (!hasVoted) {
                    document.querySelectorAll('.poll-option-btn').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            // Immediate check to prevent double-clicks
                            if (localStorage.getItem(`voted_${pollId}`)) return;
                            
                            const option = btn.getAttribute('data-option');
                            
                            // Disable ALL buttons immediately in the UI
                            document.querySelectorAll('.poll-option-btn').forEach(b => b.disabled = true);
                            
                            try {
                                localStorage.setItem(`voted_${pollId}`, 'true');
                                await updateDoc(doc(db, "polls", pollId), {
                                    [`votes.${option}`]: increment(1)
                                });
                            } catch (e) {
                                console.error("Vote failed", e);
                                localStorage.removeItem(`voted_${pollId}`);
                                document.querySelectorAll('.poll-option-btn').forEach(b => b.disabled = false);
                                showToast("Failed to vote. Please try again.", "ph-x", "var(--danger)");
                            }
                        });
                    });
                }
            });
        }
    </script>
    <script type="module" src="visits.js"></script>
    <script type="module" src="chat.js"></script>
<script type="module" src="game.js?v=1"></script>    <script type="module" src="bug-report.js"></script>
    <script type="module" src="legal-block.js"></script>
</body>
</html>
