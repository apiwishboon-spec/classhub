<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Staff - MyClassHub</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=10">
    <!-- Using IBM Plex Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div id="toast-container"></div>
    
    <div class="app-container">
        <header class="top-nav" style="background: #fff; border-bottom: 1px solid #ddd;">
            <div class="nav-brand">
                <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem; color: #000;">
                    <i class="ph ph-caret-left" style="font-size: 1.5rem;"></i>
                    <span style="font-weight: 600; font-size: 1.1rem;">Staff</span>
                </a>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <i class="ph ph-magnifying-glass" style="font-size: 1.2rem; color: #555;"></i>
                <i class="ph ph-list" style="font-size: 1.2rem; color: #555;"></i>
            </div>
        </header>

        <main style="display: flex; flex-direction: column; height: calc(100vh - 60px); position: relative;">
            <!-- Chat History -->
            <div id="chat-page-history" style="flex: 1; overflow-y: auto;">
                <div style="display: flex; justify-content: center; padding: 2rem;">
                    <div class="chat-loader"><span></span><span></span><span></span></div>
                </div>
            </div>

            <!-- LINE style Input -->
            <div class="chat-input-container">
                <i class="ph ph-plus" style="font-size: 1.5rem; color: #555; cursor: pointer;"></i>
                <i class="ph ph-camera" style="font-size: 1.5rem; color: #555; cursor: pointer;"></i>
                <i class="ph ph-image" style="font-size: 1.5rem; color: #555; cursor: pointer;"></i>
                <div style="flex: 1; position: relative; display: flex; align-items: center;">
                    <textarea id="chat-page-input" class="chat-input-field" placeholder="Aa" rows="1"></textarea>
                    <i class="ph ph-smiley" style="position: absolute; right: 10px; font-size: 1.2rem; color: #555; cursor: pointer;"></i>
                </div>
                <button id="chat-page-send" class="chat-send-btn">
                    <i class="ph ph-paper-plane-right-fill"></i>
                </button>
            </div>
            
            <!-- Hidden urgent toggle -->
            <input type="checkbox" id="chat-page-urgent" style="display: none;">
        </main>
    </div>

    <script type="module" src="chat.js"></script>
<script type="module" src="game.js"></script>    <script type="module">
        import { initTheme } from './admin.js';
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            
            document.getElementById('theme-toggle')?.addEventListener('click', () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                }
            });
        });
    </script>
</body>
</html>
