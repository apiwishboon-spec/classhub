<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Staff - MyClassHub</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=10">
    <!-- Using IBM Plex Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div id="toast-container"></div>
    
    <div class="app-container">
        <header class="top-nav">
            <div class="nav-brand">
                <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="ph ph-arrow-left" style="color: var(--accent-color); font-size: 1.2rem;"></i>
                    <h1 style="color: var(--accent-color); font-size: 1.25rem;">MyClassHub</h1>
                </a>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button id="theme-toggle" class="icon-button" aria-label="Toggle Dark Mode">
                    <i class="ph ph-moon"></i>
                </button>
            </div>
        </header>

        <main class="dashboard-grid">
            <section class="dashboard-card span-2" style="display: flex; flex-direction: column; min-height: calc(100vh - 120px);">
                <div class="card-header">
                    <h2><i class="ph ph-chat-centered-text"></i> Message Staff</h2>
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin: 0;">Your messages are anonymous to the staff.</p>
                </div>
                
                <div class="card-content" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-top: 0;">
                    <!-- Chat History Container -->
                    <div id="chat-page-history" style="flex: 1; overflow-y: auto; padding: 1.5rem 0.5rem; display: flex; flex-direction: column; gap: 1.5rem;">
                        <div class="loading-placeholder">
                            <div class="loader"></div>
                            <p>Loading messages...</p>
                        </div>
                    </div>

                    <!-- Input Area -->
                    <div style="padding: 1.5rem 0; border-top: 1px solid var(--border-color); background: var(--card-bg);">
                        <div class="admin-form-stack">
                            <textarea id="chat-page-input" placeholder="Type a new message to staff..." class="form-input" rows="3" style="border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.95rem; resize: none;"></textarea>
                            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                                <div style="display: flex; gap: 0.5rem; align-items: center;">
                                    <input type="checkbox" id="chat-page-urgent">
                                    <label for="chat-page-urgent" style="font-size: 0.85rem; color: var(--danger); font-weight: 600; cursor: pointer;">Mark as Urgent</label>
                                </div>
                                <button class="btn-primary" id="chat-page-send" style="padding: 0.75rem 2rem; display: flex; align-items: center; gap: 0.5rem;">
                                    <i class="ph ph-paper-plane-tilt"></i> Send Message
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="chat.js"></script>
    <script type="module">
        import { initTheme } from './admin.js';
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            
            document.getElementById('theme-toggle')?.addEventListener('click', () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                }
            });
        });
    </script>
</body>
</html>
