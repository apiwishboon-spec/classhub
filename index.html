<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyClassHub - Classroom Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-300HW5WQC6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-300HW5WQC6');
    </script>
    <!-- Using IBM Plex Sans for Carbon Design System -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <!-- Toast Notification Container -->
    <div id="toast-container"></div>
    
    <div class="app-container">
        <header class="top-nav">
            <div class="nav-brand">
                <h1 style="color: var(--accent-color);">MyClassHub</h1>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <div class="search-wrapper">
                    <i class="ph ph-magnifying-glass search-icon"></i>
                    <input type="text" id="global-search" placeholder="Search everything..." aria-label="Search">
                </div>
                <a href="admin.html" class="icon-button" aria-label="Admin Panel"><i class="ph ph-user-gear"></i></a>
                <button id="theme-toggle" class="icon-button" aria-label="Toggle Dark Mode">
                    <i class="ph ph-moon"></i>
                </button>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Schedule Section -->
            <section id="schedule-section" class="dashboard-card span-2">
                <div class="card-header">
                    <h2><i class="ph ph-calendar"></i> Schedule</h2>
                    <div id="current-time-display" class="time-badge">--:--</div>
                </div>
                <div class="card-content">
                    <div class="overflow-x-auto">
                        <div id="schedule-container" class="loading-placeholder">
                            <div class="loader"></div>
                            <p>Loading schedule...</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Announcements Section -->
            <section id="announcements-section" class="dashboard-card card-scrollable">
                <div class="card-header">
                    <h2><i class="ph ph-megaphone"></i> Announcements</h2>
                </div>
                <div class="card-content">
                    <div id="announcements-container" class="loading-placeholder">
                        <div class="loader"></div>
                        <p>Loading announcements...</p>
                    </div>
                </div>
            </section>

            <!-- Homework Section -->
            <section id="homework-section" class="dashboard-card card-scrollable">
                <div class="card-header">
                    <h2><i class="ph ph-pencil-simple"></i> Homework</h2>
                </div>
                <div class="card-content">
                    <div id="homework-container" class="loading-placeholder">
                        <div class="loader"></div>
                        <p>Loading homework...</p>
                    </div>
                </div>
            </section>

            <!-- Quick Notes Section -->
            <section id="notes-section" class="dashboard-card span-2">
                <div class="card-header">
                    <h2><i class="ph ph-note"></i> Quick Notes</h2>
                    <button id="add-note-btn" class="icon-button" aria-label="Add Note"><i class="ph ph-plus"></i></button>
                </div>
                <div class="card-content">
                    <div id="notes-container" class="notes-grid">
                        <div class="empty-notes">
                            <i class="ph ph-pencil-line"></i>
                            <p>No notes yet. Click + to add one!</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        
        <footer style="text-align: center; margin-top: 3rem; padding: 2rem 0; border-top: 1px solid var(--border-color); color: var(--text-secondary); font-size: 0.85rem;">
            <div style="margin-bottom: 1rem; display: flex; justify-content: center; gap: 1.5rem;">
                <a href="privacy.html" style="color: var(--text-secondary); text-decoration: none;">Privacy Policy</a>
                <a href="terms.html" style="color: var(--text-secondary); text-decoration: none;">Terms of Service</a>
                <a href="contact.html" style="color: var(--text-secondary); text-decoration: none;">Contact Admin</a>
            </div>
            <div>&copy; 2026 Apiwish Anutaravanichkul.</div>
            <div style="margin-top: 0.25rem;"><span class="app-version">V.3.2.1</span></div>
        </footer>
    </div>
    
    <script type="module" src="script.js"></script>
    <script src="help.js"></script>
</body>
</html>
