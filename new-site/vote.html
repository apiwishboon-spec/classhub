<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote | MyClassHub</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-300HW5WQC6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-300HW5WQC6');
  </script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--md-sys-color-surface-container-low);
      margin: 0;
      padding: 1.5rem;
    }
    .vote-wrapper {
      max-width: 480px;
      width: 100%;
      padding: 2.5rem;
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-extra-large);
      box-shadow: var(--md-elevation-3);
      animation: scaleUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .poll-option-btn {
      width: 100%;
      text-align: left;
      position: relative;
      z-index: 1;
      background: var(--md-sys-color-surface);
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      padding: 1rem 1.25rem;
      border-radius: var(--md-shape-corner-medium);
      border: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color var(--transition-fast), background-color var(--transition-fast);
      outline: none;
    }
    .poll-option-btn:hover:not(:disabled) {
      border-color: var(--md-sys-color-primary);
      background-color: var(--md-sys-color-surface-container-highest);
    }
    .poll-option-btn:disabled {
      cursor: default;
    }
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: var(--md-sys-color-primary-container);
      opacity: 0.5;
      z-index: -1;
      transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .status-msg {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }
    .loading-vote {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      color: var(--md-sys-color-on-surface-variant);
    }
  </style>
</head>
<body>
  <!-- Toast Notification Container -->
  <div id="toast-container"></div>
  
  <div class="vote-wrapper">
    <div id="vote-ui" class="loading-vote">
      <div class="chat-loader">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <p class="body-medium">Loading classroom poll...</p>
    </div>
  </div>

  <!-- CDNs and Scripts -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script type="module">
    import { db } from './firebase-config.js';
    import { doc, getDoc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const container = document.querySelector('.vote-wrapper');
    const voteUi = document.getElementById('vote-ui');
    
    // Theme initialization
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    const urlParams = new URLSearchParams(window.location.search);
    const pollId = urlParams.get('pollId');

    if (!pollId) {
      voteUi.innerHTML = `
        <span class="material-icons" style="font-size:48px; color:var(--md-sys-color-error);">warning</span>
        <p class="body-large" style="font-weight:600;">Invalid Poll Link</p>
        <a href="./" class="md-btn outlined" style="text-decoration:none; margin-top:1rem;">Go Home</a>
      `;
    } else {
      initPoll();
    }

    function initPoll() {
      onSnapshot(doc(db, "polls", pollId), (docSnap) => {
        if (!docSnap.exists()) {
          voteUi.innerHTML = `
            <span class="material-icons" style="font-size:48px; color:var(--md-sys-color-error);">warning</span>
            <p class="body-large" style="font-weight:600;">This poll no longer exists.</p>
            <a href="./" class="md-btn outlined" style="text-decoration:none; margin-top:1rem;">Go Home</a>
          `;
          return;
        }

        const data = docSnap.data();
        const totalVotes = Object.values(data.votes || {}).reduce((a, b) => a + b, 0);
        const hasVoted = localStorage.getItem(`voted_${pollId}`);
        const isOpen = data.isOpen !== false;

        let html = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem; border-bottom: 1px solid var(--md-sys-color-outline-variant); padding-bottom: 1rem;">
            <h2 class="title-large" style="margin:0; font-weight:700;">${data.question}</h2>
            <span class="md-badge primary">${totalVotes} votes</span>
          </div>
          ${!isOpen && !hasVoted ? `<p class="body-medium" style="text-align:center; color:var(--md-sys-color-error); font-weight:700; margin-bottom:1rem;">🗳️ This poll is closed. Results are below.</p>` : ''}
          <div id="options-list">
        `;

        data.options.forEach(opt => {
          const count = data.votes[opt] || 0;
          const percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
          const revealStats = !isOpen || (isOpen && hasVoted);
          
          html += `
            <button class="poll-option-btn" data-option="${opt}" ${hasVoted || !isOpen ? 'disabled' : ''}>
              <span style="position:relative; z-index:2;">${opt}</span>
              ${revealStats ? `<span style="position:relative; z-index:2; font-weight:700; color:var(--md-sys-color-primary);">${percent}% (${count})</span>` : ''}
              <div class="progress-bar" style="width: ${revealStats ? percent : 0}%"></div>
            </button>
          `;
        });

        html += `
          </div>
          <div class="status-msg">
            ${!isOpen ? 'Poll closed by staff.' : hasVoted ? `Thanks for voting! (Total votes: ${totalVotes})` : 'Select an option to cast your vote.'}
          </div>
          <div style="text-align: center; margin-top: 1.5rem;">
            <a href="./" class="label-large" style="color: var(--md-sys-color-primary); text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem;">
              <span class="material-icons" style="font-size: 16px;">arrow_back</span> Back to Dashboard
            </a>
          </div>
        `;

        voteUi.className = '';
        voteUi.innerHTML = html;

        // Add listeners if not voted
        if (!hasVoted) {
          document.querySelectorAll('.poll-option-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              if (localStorage.getItem(`voted_${pollId}`)) return;
              
              const option = btn.getAttribute('data-option');
              document.querySelectorAll('.poll-option-btn').forEach(b => b.disabled = true);
              
              try {
                await updateDoc(doc(db, "polls", pollId), {
                  [`votes.${option}`]: increment(1)
                });
                localStorage.setItem(`voted_${pollId}`, 'true');
              } catch (e) {
                console.error("Vote failed", e);
                localStorage.removeItem(`voted_${pollId}`);
                document.querySelectorAll('.poll-option-btn').forEach(b => b.disabled = false);
                alert("Failed to submit vote. Please try again.");
              }
            });
          });
        }
      });
    }
  </script>
  <script type="module" src="visits.js"></script>
  <script type="module" src="chat.js"></script>
  <script type="module" src="game.js"></script>
  <script type="module" src="bug-report.js"></script>
</body>
</html>
