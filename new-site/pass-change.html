<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset | MyClassHub</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-300HW5WQC6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-300HW5WQC6');
  </script>

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--md-sys-color-surface-container-low);
      margin: 0;
      padding: 1.5rem;
    }
    .pass-change-wrapper {
      max-width: 440px;
      width: 100%;
      padding: 2.5rem;
      background-color: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-extra-large);
      box-shadow: var(--md-elevation-3);
      position: relative;
      animation: scaleUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--md-shape-corner-extra-large);
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    [data-theme="dark"] #loading-overlay {
      background: rgba(15, 13, 19, 0.7);
    }
    .status-msg-box {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: var(--md-shape-corner-small);
      font-size: 0.875rem;
      font-weight: 600;
      display: none;
    }
    .status-msg-box.error {
      display: block;
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      border: 1px solid var(--md-sys-color-error);
    }
    .status-msg-box.success {
      display: block;
      background-color: var(--md-sys-color-success-container);
      color: var(--md-sys-color-on-success-container);
      border: 1px solid var(--md-sys-color-success);
    }
  </style>
</head>
<body>
  <div class="pass-change-wrapper" id="main-card">
    <div id="loading-overlay">
      <div class="chat-loader">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="logo.png" alt="MyClassHub Logo" style="height: 60px; border-radius: var(--md-shape-corner-medium); background: #000; padding: 4px; margin-bottom: 1rem;">
      <h1 class="headline-small" style="font-weight: 700;">Reset Password</h1>
    </div>

    <!-- Active Form UI -->
    <div id="reset-form-ui" style="display: none;">
      <p class="body-medium" style="color: var(--md-sys-color-on-surface-variant); margin-bottom: 1.5rem;">
        Please enter a new secure password for <strong id="user-email" style="color:var(--md-sys-color-primary);">...</strong>
      </p>
      
      <div class="md-text-field">
        <input type="password" id="new-password" placeholder=" " required>
        <label>New Password</label>
        <div class="md-helper-text">At least 6 characters</div>
      </div>

      <div class="md-text-field">
        <input type="password" id="confirm-password" placeholder=" " required>
        <label>Confirm Password</label>
      </div>

      <button id="submit-btn" class="md-btn filled" style="width: 100%;">
        <span class="material-icons" style="font-size:18px;">lock_reset</span> Change Password
      </button>
    </div>

    <div id="status-message" class="status-msg-box"></div>

    <!-- Link Expired State -->
    <div id="expired-ui" style="display: none; text-align: center;">
      <span class="material-icons" style="font-size: 48px; color: var(--md-sys-color-error); margin-bottom: 1rem;">error_outline</span>
      <p class="body-large" style="font-weight: 600; color: var(--md-sys-color-on-surface-variant); margin-bottom: 1.5rem;">This link is invalid or has expired.</p>
      <a href="admin.html" class="md-btn outlined" style="text-decoration: none; display: block;">Return to Login</a>
    </div>

    <!-- Success State -->
    <div id="success-ui" style="display: none; text-align: center;">
      <span class="material-icons" style="font-size: 48px; color: var(--md-sys-color-success); margin-bottom: 1rem;">check_circle_outline</span>
      <p class="body-large" style="font-weight: 600; color: var(--md-sys-color-on-surface-variant); margin-bottom: 1.5rem;">Your password has been successfully updated!</p>
      <a href="admin.html" class="md-btn filled" style="text-decoration: none; display: block;">Log In Now</a>
    </div>
  </div>

  <!-- CDNs and Scripts -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script type="module">
    import { auth } from './firebase-config.js';
    import { verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const loadingOverlay = document.getElementById('loading-overlay');
    const resetFormUi = document.getElementById('reset-form-ui');
    const expiredUi = document.getElementById('expired-ui');
    const successUi = document.getElementById('success-ui');
    const statusMsg = document.getElementById('status-message');
    const userEmailSpan = document.getElementById('user-email');
    const newPassInput = document.getElementById('new-password');
    const confirmPassInput = document.getElementById('confirm-password');
    const submitBtn = document.getElementById('submit-btn');

    // Theme initialization
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    // Get parameters from URL
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    const actionCode = urlParams.get('oobCode');

    if (mode === 'resetPassword' && actionCode) {
      verifyCode();
    } else {
      showExpired();
    }

    async function verifyCode() {
      try {
        const email = await verifyPasswordResetCode(auth, actionCode);
        userEmailSpan.textContent = email;
        loadingOverlay.style.display = 'none';
        resetFormUi.style.display = 'block';
      } catch (error) {
        console.error("Verification error:", error);
        showExpired();
      }
    }

    function showExpired() {
      loadingOverlay.style.display = 'none';
      resetFormUi.style.display = 'none';
      expiredUi.style.display = 'block';
    }

    submitBtn.onclick = async () => {
      const newPass = newPassInput.value;
      const confirmPass = confirmPassInput.value;

      if (newPass.length < 6) {
        showStatus("Password must be at least 6 characters.", "error");
        return;
      }
      if (newPass !== confirmPass) {
        showStatus("Passwords do not match.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <div class="chat-loader" style="justify-content:center;">
          <span></span><span></span><span></span>
        </div>`;

      try {
        await confirmPasswordReset(auth, actionCode, newPass);
        resetFormUi.style.display = 'none';
        statusMsg.style.display = 'none';
        successUi.style.display = 'block';
      } catch (error) {
        console.error("Reset error:", error);
        showStatus(error.message, "error");
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span class="material-icons" style="font-size:18px;">lock_reset</span> Change Password';
      }
    };

    function showStatus(msg, type) {
      statusMsg.textContent = msg;
      statusMsg.className = `status-msg-box ${type}`;
      statusMsg.style.display = 'block';
    }
  </script>
  <script type="module" src="visits.js"></script>
  <script type="module" src="chat.js"></script>
  <script type="module" src="game.js"></script>
  <script type="module" src="bug-report.js"></script>
</body>
</html>
