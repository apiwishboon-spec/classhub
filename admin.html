<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyClassHub - Admin Dashboard</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <!-- Using IBM Plex Sans for Carbon Design System -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container" id="login-container">
        <div class="dashboard-card" style="max-width: 400px; margin: 100px auto; padding: 2rem;">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Staff Login</h2>
            
            <div id="password-login-fields">
                <input type="email" id="email" placeholder="Email" class="form-input" style="margin-bottom: 1rem;">
                <input type="password" id="password" placeholder="Password" class="form-input" style="margin-bottom: 1.5rem;">
                <button id="login-btn" class="btn-primary" style="width: 100%;">Login with Password</button>
            </div>

            <div style="margin: 1.5rem 0; text-align: center; position: relative;">
                <hr style="border: none; border-top: 1px solid var(--border-color);">
                <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); padding: 0 0.5rem; color: var(--text-secondary); font-size: 0.8rem;">OR</span>
            </div>

            <div id="email-link-login-fields">
                <input type="email" id="email-link-input" placeholder="Email for login link" class="form-input" style="margin-bottom: 1rem;">
                <button id="send-link-btn" class="btn-primary" style="width: 100%;">Send Login Link</button>
            </div>

            <p id="login-error" style="color: var(--danger); margin-top: 1rem; display: none; text-align: center;"></p>
            <p id="login-success" style="color: var(--success); margin-top: 1rem; display: none; text-align: center;"></p>
            
            <div style="text-align: center; margin-top: 1.5rem;">
                <a href="index.html" style="color: var(--accent-color); text-decoration: none; font-size: 0.9rem;">Back to Dashboard</a>
            </div>
        </div>
    </div>

    <div class="app-container" id="admin-container" style="display: none;">
        <header class="top-nav">
            <div class="nav-brand">
                <h1 style="color: var(--accent-color);">Admin Panel</h1>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <span id="user-role-badge" class="time-badge">Role: Teacher</span>
                <button id="logout-btn" class="icon-button" aria-label="Logout"><i class="ph ph-sign-out"></i></button>
                <a href="index.html" class="icon-button" aria-label="Home"><i class="ph ph-house"></i></a>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Add Announcement -->
            <section class="dashboard-card" id="add-announcement-section">
                <div class="card-header">
                    <h2><i class="ph ph-megaphone"></i> Post Announcement</h2>
                </div>
                <div class="card-content" style="display: flex; flex-direction: column; gap: 1rem;">
                    <input type="text" id="ann-title" placeholder="Title" class="form-input">
                    <textarea id="ann-message" placeholder="Message" class="form-input" rows="3"></textarea>
                    <input type="text" id="ann-author" placeholder="Author Name" class="form-input">
                    <button id="add-ann-btn" class="btn-primary">Post Announcement</button>
                </div>
            </section>

            <!-- Add Homework -->
            <section class="dashboard-card" id="add-homework-section">
                <div class="card-header">
                    <h2><i class="ph ph-pencil-simple"></i> Post Homework</h2>
                </div>
                <div class="card-content" style="display: flex; flex-direction: column; gap: 1rem;">
                    <input type="text" id="hw-subject" placeholder="Subject" class="form-input">
                    <input type="text" id="hw-task" placeholder="Task Description" class="form-input">
                    <input type="text" id="hw-due" placeholder="Due Date (e.g., Tomorrow)" class="form-input">
                    <button id="add-hw-btn" class="btn-primary">Post Homework</button>
                </div>
            </section>

            <!-- Manage Announcements (Admin & Teacher) -->
            <section class="dashboard-card span-2" id="manage-announcements-section">
                <div class="card-header">
                    <h2><i class="ph ph-list-bullets"></i> Manage Announcements</h2>
                </div>
                <div class="card-content">
                    <div id="announcements-list-admin" class="overflow-x-auto">
                        <!-- List announcements here -->
                    </div>
                </div>
            </section>

            <!-- Manage Homework (Admin & Teacher) -->
            <section class="dashboard-card span-2" id="manage-homework-section">
                <div class="card-header">
                    <h2><i class="ph ph-notebook"></i> Manage Homework</h2>
                </div>
                <div class="card-content">
                    <div id="homework-list-admin" class="overflow-x-auto">
                        <!-- List homework here -->
                    </div>
                </div>
            </section>

            <!-- Manage Schedule (Admin Only) -->
            <section class="dashboard-card span-2" id="manage-schedule-section" style="display: none;">
                <div class="card-header">
                    <h2><i class="ph ph-calendar"></i> Manage Schedule (Admin Only)</h2>
                </div>
                <div class="card-content">
                    <div id="schedule-form-container" style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                        <input type="hidden" id="sched-id">
                        <input type="text" id="sched-time" placeholder="Time (e.g. 08:00-08:50)" class="form-input" style="flex: 1; min-width: 120px;">
                        <input type="text" id="sched-mon" placeholder="Mon" class="form-input" style="flex: 1; min-width: 100px;">
                        <input type="text" id="sched-tue" placeholder="Tue" class="form-input" style="flex: 1; min-width: 100px;">
                        <input type="text" id="sched-wed" placeholder="Wed" class="form-input" style="flex: 1; min-width: 100px;">
                        <input type="text" id="sched-thu" placeholder="Thu" class="form-input" style="flex: 1; min-width: 100px;">
                        <input type="text" id="sched-fri" placeholder="Fri" class="form-input" style="flex: 1; min-width: 100px;">
                        <button id="add-sched-btn" class="btn-primary">Save Time Slot</button>
                    </div>
                    <div id="schedule-list" class="overflow-x-auto">
                        <!-- List schedule here -->
                    </div>
                </div>
            </section>

            <!-- Manage Users (Admin Only) -->
            <section class="dashboard-card span-2" id="manage-users-section" style="display: none;">
                <div class="card-header">
                    <h2><i class="ph ph-users"></i> Manage Users (Admin Only)</h2>
                </div>
                <div class="card-content">
                    <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                        <input type="email" id="new-user-email" placeholder="New User Email" class="form-input" style="flex: 1; min-width: 200px;">
                        <input type="password" id="new-user-pass" placeholder="Password" class="form-input" style="flex: 1; min-width: 200px;">
                        <select id="new-user-role" class="form-input" style="flex: 1; min-width: 120px;">
                            <option value="teacher">Teacher</option>
                            <option value="ta">TA</option>
                            <option value="admin">Admin</option>
                        </select>
                        <button id="add-user-btn" class="btn-primary">Add User</button>
                    </div>
                    <div id="users-list" class="overflow-x-auto">
                        <!-- List users here -->
                    </div>
                </div>
            </section>
        </main>
        
        <footer style="text-align: center; margin-top: 3rem; padding: 2rem 0; border-top: 1px solid var(--border-color); color: var(--text-secondary); font-size: 0.85rem;">
            <div style="margin-bottom: 1rem; display: flex; justify-content: center; gap: 1.5rem;">
                <a href="privacy.html" style="color: var(--text-secondary); text-decoration: none;">Privacy Policy</a>
                <a href="terms.html" style="color: var(--text-secondary); text-decoration: none;">Terms of Service</a>
                <a href="contact.html" style="color: var(--text-secondary); text-decoration: none;">Contact Admin</a>
            </div>
            &copy; 2026 Apiwish Anutaravanichkul.
        </footer>
    </div>
    
    <script type="module" src="admin.js"></script>
</body>
</html>
