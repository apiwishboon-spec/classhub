name: Cloudflare Pages Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Add build steps here if you ever use a framework like React/Vue
      # - name: Install dependencies
      #   run: npm install
      # - name: Build
      #   run: npm run build

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: myclasshub # Replace with your actual Cloudflare Pages project name
          directory: . # The directory containing your static files (index.html, etc.)
          # Optional: Enable this if you want to have a comment on PRs with the preview URL
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Summary
        if: always()
        run: |
          # Get short SHA
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          # Use heredoc for better reliability
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 Deployment Report
          
          | Key | Info |
          | :--- | :--- |
          | **Status** | ${{ job.status == 'success' && '✅ Success' || '❌ Failed' }} |
          | **Project** | \`myclasshub\` |
          | **Link** | [**Open Application ↗️**](${{ steps.deploy.outputs.url }}) |
          
          <br />
          
          <details open>
          <summary><b>📝 Version & Commit Info</b></summary>
          <br />
          
          - **Commit ID:** \`$SHORT_SHA\`
          - **Message:** ${{ github.event.head_commit.message }}
          - **Author:** @${{ github.actor }}
          - **Branch:** \`${{ github.ref_name }}\`
          </details>
          EOF
