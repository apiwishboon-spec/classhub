name: Cloudflare Pages Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Add build steps here if you ever use a framework like React/Vue
      # - name: Install dependencies
      #   run: npm install
      # - name: Build
      #   run: npm run build

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: myclasshub # Replace with your actual Cloudflare Pages project name
          directory: . # The directory containing your static files (index.html, etc.)
          # Optional: Enable this if you want to have a comment on PRs with the preview URL
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Summary
        if: always()
        run: |
          # Get short SHA
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          echo "<h2>🚀 Deployment Report</h2>" >> $GITHUB_STEP_SUMMARY
          echo "<table>" >> $GITHUB_STEP_SUMMARY
          echo "  <tr>" >> $GITHUB_STEP_SUMMARY
          echo "    <td width='100'><b>Status</b></td>" >> $GITHUB_STEP_SUMMARY
          echo "    <td>${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}</td>" >> $GITHUB_STEP_SUMMARY
          echo "  </tr>" >> $GITHUB_STEP_SUMMARY
          echo "  <tr>" >> $GITHUB_STEP_SUMMARY
          echo "    <td><b>Project</b></td>" >> $GITHUB_STEP_SUMMARY
          echo "    <td><code>myclasshub</code></td>" >> $GITHUB_STEP_SUMMARY
          echo "  </tr>" >> $GITHUB_STEP_SUMMARY
          echo "  <tr>" >> $GITHUB_STEP_SUMMARY
          echo "    <td><b>Link</b></td>" >> $GITHUB_STEP_SUMMARY
          echo "    <td><a href='${{ steps.deploy.outputs.url }}'><b>Open Application ↗️</b></a></td>" >> $GITHUB_STEP_SUMMARY
          echo "  </tr>" >> $GITHUB_STEP_SUMMARY
          echo "</table>" >> $GITHUB_STEP_SUMMARY
          echo "<br />" >> $GITHUB_STEP_SUMMARY
          echo "<details open>" >> $GITHUB_STEP_SUMMARY
          echo "  <summary><b>📝 Version & Commit Info</b></summary>" >> $GITHUB_STEP_SUMMARY
          echo "  <br />" >> $GITHUB_STEP_SUMMARY
          echo "  <ul>" >> $GITHUB_STEP_SUMMARY
          echo "    <li><b>Commit ID:</b> <code>$SHORT_SHA</code></li>" >> $GITHUB_STEP_SUMMARY
          echo "    <li><b>Message:</b> ${{ github.event.head_commit.message }}</li>" >> $GITHUB_STEP_SUMMARY
          echo "    <li><b>Author:</b> @${{ github.actor }}</li>" >> $GITHUB_STEP_SUMMARY
          echo "    <li><b>Branch:</b> <code>${{ github.ref_name }}</code></li>" >> $GITHUB_STEP_SUMMARY
          echo "  </ul>" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
