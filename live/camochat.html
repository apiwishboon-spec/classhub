<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat - MyClassHub</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon.png">
    <link rel="apple-touch-icon" href="../favicon.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../style.css?v=34">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div id="toast-container"></div>

    <div class="app-container">
        <header class="top-nav">
            <div class="nav-brand">
                <a href="./" style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="ph ph-arrow-left" style="color: var(--accent-color); font-size: 1.2rem;"></i>
                    <h1 style="color: var(--accent-color); font-size: 1.25rem;">MyClassHub</h1>
                </a>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <span class="time-badge" style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem;">
                    <span class="status-dot online"></span> Live
                </span>
            </div>
        </header>

        <main class="dashboard-grid">
            <section class="dashboard-card span-2" style="display: flex; flex-direction: column; min-height: calc(100vh - 120px);">
                <div class="card-header">
                    <h2><i class="ph ph-broadcast"></i> Live Chat</h2>
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin: 0;">Say hi — your messages show up live! Be nice. 😊</p>
                </div>

                <div class="card-content" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-top: 0;">
                    <div id="chat-history" style="flex: 1; overflow-y: auto; padding: 1.5rem 0.5rem; display: flex; flex-direction: column; gap: 0.9rem;">
                        <div class="chat-loader">
                            <span></span><span></span><span></span>
                        </div>
                    </div>

                    <div style="padding: 1.5rem 0; border-top: 1px solid var(--border-color); background: var(--card-bg);">
                        <div class="admin-form-stack">
                            <div style="display: flex; gap: 0.75rem; align-items: center;">
                                <input type="text" id="name-input" placeholder="Your name" class="form-input" style="max-width: 220px; font-size: 0.9rem;" autocomplete="given-name">
                                <span id="cooldown-note" style="font-size: 0.75rem; color: var(--text-secondary); display: none;"></span>
                            </div>
                            <textarea id="comment-input" placeholder="Type a comment..." class="form-input" rows="3" style="border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.95rem; resize: none;"></textarea>
                            <div style="display: flex; justify-content: flex-end;">
                                <button class="btn-primary" id="send-btn" style="padding: 0.75rem 2rem; display: flex; align-items: center; gap: 0.5rem;">
                                    <i class="ph ph-paper-plane-tilt"></i> Send
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { db } from "../firebase-config.js";
        import { collection, addDoc, query, orderBy, limit, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { sanitize } from "../profanity-filter.js";

        const MSG_TTL = 60 * 60 * 1000; // auto-clear messages older than this

        const history = document.getElementById('chat-history');
        const nameInput = document.getElementById('name-input');
        const commentInput = document.getElementById('comment-input');
        const sendBtn = document.getElementById('send-btn');
        const cooldownNote = document.getElementById('cooldown-note');

        let cooldownUntil = 0;
        const savedName = localStorage.getItem('camochat_name');
        if (savedName) nameInput.value = savedName;

        function escapeHtml(str) {
            if (!str) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
            return String(str).replace(/[&<>"']/g, c => map[c]);
        }

        function fmtTime(ts) {
            if (!ts) return '';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        onSnapshot(
            query(collection(db, "camochat"), orderBy("createdAt", "desc"), limit(80)),
            (snap) => {
                const items = [];
                snap.forEach(d => items.push({ id: d.id, data: d.data() }));
                items.reverse();

                const now = Date.now();
                items.forEach(({ id, data }) => {
                    const ts = data.createdAt ? (data.createdAt.toMillis ? data.createdAt.toMillis() : new Date(data.createdAt).getTime()) : 0;
                    if (ts && now - ts >= MSG_TTL) {
                        deleteDoc(doc(db, "camochat", id)).catch(() => {});
                    }
                });

                history.innerHTML = items.map(({ data }) => {
                    const admin = !!data.isAdmin;
                    return `
                        <div style="display: flex; flex-direction: column; align-items: ${admin ? 'flex-start' : 'flex-end'}; gap: 0.25rem;">
                            <div class="chat-bubble ${admin ? 'staff' : 'user'}">
                                ${escapeHtml(data.text)}
                            </div>
                            <span style="font-size: 0.68rem; color: var(--text-secondary);">
                                ${admin ? '<i class="ph ph-star" style="color: var(--accent-color);"></i> ' : ''}
                                <strong>${escapeHtml(data.sender || (admin ? 'ME' : 'Friend'))}</strong>
                                ${data.createdAt ? ' · ' + fmtTime(data.createdAt) : ''}
                            </span>
                        </div>
                    `;
                }).join('');

                if (!items.length) {
                    history.innerHTML = `
                        <div style="text-align: center; color: var(--text-secondary); margin-top: 2rem;">
                            <i class="ph ph-chat-circle-dots" style="font-size: 3rem; opacity: 0.2; display: block; margin-bottom: 1rem;"></i>
                            <p>No comments yet. Say something! 👋</p>
                        </div>
                    `;
                }

                history.scrollTop = history.scrollHeight;
            },
            (error) => {
                history.innerHTML = `<p style="color: var(--danger);">Failed to load chat: ${escapeHtml(error.message)}</p>`;
            }
        );

        async function sendMessage() {
            const name = sanitize(nameInput.value.trim()).slice(0, 40);
            const text = sanitize(commentInput.value.trim()).slice(0, 500);

            if (!name) {
                nameInput.focus();
                alert('Please enter your name first.');
                return;
            }
            if (!text) {
                commentInput.focus();
                return;
            }

            const now = Date.now();
            if (now < cooldownUntil) {
                const secs = Math.ceil((cooldownUntil - now) / 1000);
                cooldownNote.textContent = `Slow down! Wait ${secs}s...`;
                return;
            }

            sendBtn.disabled = true;
            try {
                await addDoc(collection(db, "camochat"), {
                    text,
                    sender: name,
                    isAdmin: false,
                    createdAt: serverTimestamp()
                });
                localStorage.setItem('camochat_name', name);
                commentInput.value = '';
                cooldownUntil = Date.now() + 3000;
            } catch (e) {
                alert('Send failed: ' + e.message);
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        commentInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        setInterval(() => {
            const left = Math.ceil((cooldownUntil - Date.now()) / 1000);
            if (left > 0) {
                cooldownNote.style.display = 'inline';
                cooldownNote.textContent = `Slow down! Wait ${left}s...`;
            } else {
                cooldownNote.style.display = 'none';
            }
        }, 500);
    </script>
</body>
</html>
