<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Inquiry - MyClassHub</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div id="toast-container"></div>
    
    <div class="app-container">
        <header class="top-nav">
            <div class="nav-brand">
                <a href="./" style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="ph ph-arrow-left" style="color: var(--accent-color); font-size: 1.2rem;"></i>
                    <h1 style="color: var(--accent-color); font-size: 1.25rem;">Ad Inquiry</h1>
                </a>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button id="theme-toggle" class="icon-button" aria-label="Toggle Dark Mode"><i class="ph ph-moon"></i></button>
                <a href="chat.html" class="icon-button" aria-label="Message Staff"><i class="ph ph-chat-centered-text"></i></a>
            </div>
        </header>

        <main style="max-width: 600px; margin: 0 auto;">
            <section class="dashboard-card">
                <div class="card-header">
                    <h2><i class="ph ph-megaphone"></i> Ad Inquiry</h2>
                </div>
                <div class="card-content">
                    <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1.5rem; text-align: center;">
                        Interested in an ad? Fill in your details below and we'll get back to you.
                    </p>
                    <div class="admin-form-stack" style="display: flex; flex-direction: column; gap: 1rem;">
                        <div>
                            <label for="inquiry-name" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-primary);">Your Name</label>
                            <input type="text" id="inquiry-name" placeholder="Enter your name..." class="form-input" style="width: 100%; box-sizing: border-box;" maxlength="100">
                        </div>
                        <div>
                            <label for="inquiry-contact" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-primary);">Contact (Phone / Email)</label>
                            <input type="text" id="inquiry-contact" placeholder="Phone number or email..." class="form-input" style="width: 100%; box-sizing: border-box;" maxlength="200">
                        </div>
                        <div>
                            <label for="inquiry-time" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-primary);">Preferred Time</label>
                            <input type="text" id="inquiry-time" placeholder="e.g. After 4 PM, Weekends, etc." class="form-input" style="width: 100%; box-sizing: border-box;" maxlength="100">
                        </div>
                        <div>
                            <label for="inquiry-message" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-primary);">Message</label>
                            <textarea id="inquiry-message" placeholder="Tell us about your interest or ask a question..." class="form-input" rows="4" style="width: 100%; box-sizing: border-box; resize: vertical;" maxlength="500"></textarea>
                        </div>
                        <div>
                            <label for="inquiry-pic" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--text-primary);">Attach Picture (Optional, Max 5MB)</label>
                            <input type="file" id="inquiry-pic" class="form-input" accept="image/*" style="width: 100%; box-sizing: border-box;">
                        </div>
                        <button id="submit-inquiry-btn" class="btn-primary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                            <i class="ph ph-paper-plane-tilt"></i> Send Inquiry
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <footer style="text-align: center; margin-top: 3rem; padding: 2rem 0; border-top: 1px solid var(--border-color); color: var(--text-secondary); font-size: 0.85rem;">
            <div style="margin-bottom: 1rem; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;">
                <a href="privacy.html" style="color: var(--text-secondary); text-decoration: none;">Privacy Policy</a>
                <a href="terms.html" style="color: var(--text-secondary); text-decoration: none;">Terms of Service</a>
                <a href="contact.html" style="color: var(--text-secondary); text-decoration: none;">Contact Admin</a>
            </div>
            <div>&copy; 2026 Apiwish Anutaravanichkul.</div>
        </footer>
    </div>

    <script src="version.js"></script>
    <script type="module" src="visits.js"></script>
    <script type="module">
        import { db, imgbbApiKey } from './firebase-config.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { sanitize } from './profanity-filter.js';

        function showToast(message, icon, color) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span class="toast-icon"><i class="ph ${icon}"></i></span><span class="toast-text">${message}</span>`;
            toast.style.borderLeftColor = color || 'var(--accent-color)';
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const submitBtn = document.getElementById('submit-inquiry-btn');
            const nameInput = document.getElementById('inquiry-name');
            const contactInput = document.getElementById('inquiry-contact');
            const timeInput = document.getElementById('inquiry-time');
            const messageInput = document.getElementById('inquiry-message');
            const picInput = document.getElementById('inquiry-pic');

            submitBtn.addEventListener('click', async () => {
                const name = sanitize(nameInput.value.trim());
                const contact = sanitize(contactInput.value.trim());
                const time = sanitize(timeInput.value.trim());
                const message = sanitize(messageInput.value.trim());
                const file = picInput.files[0];

                if (!name) {
                    showToast("Please enter your name.", "ph-warning", "var(--warning)");
                    nameInput.focus();
                    return;
                }
                if (!contact) {
                    showToast("Please enter your contact info.", "ph-warning", "var(--warning)");
                    contactInput.focus();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="ph ph-circle-notch ph-spin"></i> Sending...';

                try {
                    let photoURL = '';
                    if (file) {
                        if (file.size > 5 * 1024 * 1024) {
                            showToast("Image too large. Max 5MB allowed.", "ph-x", "var(--danger)");
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = '<i class="ph ph-paper-plane-tilt"></i> Send Inquiry';
                            return;
                        }
                        const formData = new FormData();
                        formData.append('image', file);
                        const response = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbApiKey}`, {
                            method: 'POST',
                            body: formData
                        });
                        const imgData = await response.json();
                        if (imgData.success) {
                            photoURL = imgData.data.url;
                        }
                    }

                    const docRef = await addDoc(collection(db, "ad_inquiries"), {
                        name,
                        contact,
                        time,
                        message,
                        photoURL,
                        createdAt: serverTimestamp(),
                        status: 'new',
                        replies: []
                    });

                    const myIds = JSON.parse(localStorage.getItem('my_ad_inquiries') || '[]');
                    if (!myIds.includes(docRef.id)) {
                        myIds.push(docRef.id);
                    }
                    localStorage.setItem('my_ad_inquiries', JSON.stringify(myIds));

                    showToast("Inquiry sent! We'll get back to you soon.", "ph-check", "var(--success)");
                    nameInput.value = '';
                    contactInput.value = '';
                    timeInput.value = '';
                    messageInput.value = '';
                    picInput.value = '';
                    setTimeout(() => { window.location.href = './'; }, 1500);
                } catch (err) {
                    console.error("Inquiry submission failed:", err);
                    showToast("Failed to send inquiry: " + err.message, "ph-x", "var(--danger)");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="ph ph-paper-plane-tilt"></i> Send Inquiry';
                }
            });
        });
    </script>
    <script>
        (function() {
            var toggle = document.getElementById('theme-toggle');
            var saved = localStorage.getItem('theme');
            var hour = new Date().getHours();
            var isDark = saved === 'dark' || (saved !== 'light' && (hour < 6 || hour > 18));
            if (isDark) { document.documentElement.setAttribute('data-theme', 'dark'); if (toggle) toggle.innerHTML = '<i class="ph ph-sun"></i>'; }
            if (toggle) toggle.addEventListener('click', function() {
                var dark = document.documentElement.hasAttribute('data-theme');
                if (dark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); toggle.innerHTML = '<i class="ph ph-moon"></i>'; }
                else { document.documentElement.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); toggle.innerHTML = '<i class="ph ph-sun"></i>'; }
            });
        })();
    </script>
</body>
</html>
